name: Pruebas

on:
  push:
  pull_request:

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Descargar Godot 4.5
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.5-stable_linux.x86_64
      - name: Compilar y conducir una vuelta automática
        run: GODOT=$PWD/Godot_v4.5-stable_linux.x86_64 ./tools/run_tests.sh
      - name: Guardar registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registros-pruebas
          path: test_output/
