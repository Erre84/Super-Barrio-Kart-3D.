name: APK Android

# Compila un APK de prueba (debug) con Godot 4.5 y lo publica en la release
# "apk-prueba" del repositorio para poder descargarlo desde el móvil.
on:
  push:
    branches: ["main", "feature/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT: ${{ github.workspace }}/../godot/Godot_v4.5-stable_linux.x86_64
      APK: build/android/SuperBarrioKart3D.apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Descargar Godot 4.5 y plantillas de exportación
        run: |
          mkdir -p ../godot && cd ../godot
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
          unzip -q godot.zip && chmod +x Godot_v4.5-stable_linux.x86_64
          curl -sSL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_export_templates.tpz
          unzip -q templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.5.stable
          mv templates/* ~/.local/share/godot/export_templates/4.5.stable/
          ls ~/.local/share/godot/export_templates/4.5.stable/ | grep android

      - name: Configurar SDK de Android y clave de depuración
        run: |
          # Clave de DEPURACIÓN fija del repositorio (contraseña pública "android"):
          # así cada APK nuevo se instala encima del anterior sin desinstalar.
          cp tools/android/debug.keystore "$HOME/debug.keystore"
          mkdir -p ~/.config/godot
          for f in editor_settings-4.5.tres editor_settings-4.tres; do
            {
              echo '[gd_resource type="EditorSettings" format=3]'
              echo ''
              echo '[resource]'
              echo "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\""
              echo "export/android/java_sdk_path = \"$JAVA_HOME\""
              echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
              echo 'export/android/debug_keystore_user = "androiddebugkey"'
              echo 'export/android/debug_keystore_pass = "android"'
            } > ~/.config/godot/$f
          done
          ls "$ANDROID_SDK_ROOT/build-tools"

      - name: Importar proyecto
        run: $GODOT --headless --path . --import

      - name: Exportar APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android
          $GODOT --headless --path . --export-debug "Android" "$APK" 2>&1 | tee export.log
          test -s "$APK"
          ls -lh "$APK"
          "$ANDROID_SDK_ROOT"/build-tools/$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)/aapt dump badging "$APK" | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: SuperBarrioKart3D-apk
          path: ${{ env.APK }}

      - name: Publicar en la release "apk-prueba"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-prueba --yes --cleanup-tag || true
          gh release create apk-prueba "$APK" --prerelease \
            --target "$GITHUB_SHA" \
            --title "APK de prueba (${GITHUB_REF_NAME}, ${GITHUB_SHA::7})" \
            --notes "APK de depuración generado automáticamente desde la rama ${GITHUB_REF_NAME}. Instrucciones de instalación en docs/ANDROID.md."
